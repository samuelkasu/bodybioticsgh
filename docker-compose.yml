services:
  # Opt-in (`docker compose --profile full up`): day to day the API runs from
  # `dotnet run` for hot reload, against the postgres container below.
  api:
    build:
      context: ./backend
    container_name: bodybiotics-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      App__ConnectionString: Host=postgres;Port=5432;Database=bodybiotics;Username=bodybiotics;Password=bodybiotics
      App__MigrateOnStart: "true"
      App__CorsOrigins__0: http://localhost:3000
    ports:
      - "5080:8080"
    profiles: ["full"]

  postgres:
    image: postgres:16-alpine
    container_name: bodybiotics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bodybiotics
      POSTGRES_PASSWORD: bodybiotics
      POSTGRES_DB: bodybiotics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Migrations run straight after `db:up`; without a healthcheck they race
      # the database's first-boot initialisation and fail on a cold volume.
      test: ["CMD-SHELL", "pg_isready -U bodybiotics -d bodybiotics"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Separate database on its own port so an E2E run can be torn down and
  # re-seeded without destroying local development data.
  postgres-test:
    image: postgres:16-alpine
    container_name: bodybiotics-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: bodybiotics
      POSTGRES_PASSWORD: bodybiotics
      POSTGRES_DB: bodybiotics_test
    ports:
      - "5433:5432"
    tmpfs:
      # Ephemeral by design: test data should never survive a restart.
      - /var/lib/postgresql/data
    profiles: ["test"]

  redis:
    image: redis:7-alpine
    container_name: bodybiotics-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
